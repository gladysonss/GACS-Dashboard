version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gacs-dashboard-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Application
      APP_URL: "http://localhost"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_TIMEZONE: "America/Sao_Paulo"

      # Database
      DB_HOST: "db"
      DB_NAME: "host_gacs"
      DB_USER: "user_gacs"
      DB_PASSWORD: "secret_password"

      # Security & Session
      SESSION_NAME: "GACS_SESSION"
      SESSION_LIFETIME: "3600"
      SESSION_SECURE: "false"
      CSRF_TOKEN_LENGTH: "32"
      PASSWORD_MIN_LENGTH: "8"

      # Default Admin Credentials
      DEFAULT_USERNAME: "admin"
      DEFAULT_PASSWORD: "muda123"

  db:
    image: mariadb:10.11
    container_name: gacs-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_DATABASE: host_gacs
      MYSQL_USER: user_gacs
      MYSQL_PASSWORD: secret_password
    volumes:
      - db_data:/var/lib/mysql
      # Map the WHOLE current directory to docker-entrypoint-initdb.d
      # MariaDB will automatically find database.sql inside it and import it
      - ./:/docker-entrypoint-initdb.d/

volumes:
  db_data:
