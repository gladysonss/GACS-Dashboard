version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gacs-dashboard-app
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: gacs-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_DATABASE: host_gacs
      MYSQL_USER: user_gacs
      MYSQL_PASSWORD: secret_password
    volumes:
      - db_data:/var/lib/mysql
      # Workaround for Coolify creating the file as a directory: mount the whole directory
      - ./:/app_data/
    command: >
      bash -c " docker-entrypoint.sh mysqld & sleep 10s; if [ ! -f /var/lib/mysql/.gacs_initialized ]; then
        echo 'Importing initial database...';
        mysql -uroot -p$$MYSQL_ROOT_PASSWORD $$MYSQL_DATABASE < /app_data/database.sql;
        touch /var/lib/mysql/.gacs_initialized;
        echo 'Database imported successfully.';
      fi; wait -n "

volumes:
  db_data:
